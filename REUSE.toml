version = 1
SPDX-PackageName = "ReUseX"
SPDX-PackageSupplier = "Povl Filip Sonne-Frederiksen"
SPDX-PackageDownloadLocation = "https://github.com/pfmephisto/ReUseX"

# Bulk licensing for docs, images, and misc config/data files where an
# inline or .license-sidecar header is impractical or adds no value
# (rendered/binary assets, generated lockfiles, editor/tool config).
# Source code keeps per-file SPDX headers (docs/STANDARDS.md; see also the
# existing per-file .license sidecars next to individual patches/images).

[[annotations]]
path = [
  "**/*.md",
  "docs/header.html",
]
SPDX-FileCopyrightText = "2025 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
  "assets/*.png",
  "docs/benchmarks/*.jpg",
  "docs/research/figures/panorama/*.jpg",
  "docs/research/figures/gsplat/*.jpg",
  "docs/research/img/**/*.png",
  "tools/rux-mcp/docs/*.png",
]
SPDX-FileCopyrightText = "2025 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "scripts/testdata/*.xml"
SPDX-FileCopyrightText = "2025 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
  ".claude/agents/*.md",
  ".claude/skills/**",
  ".claude/settings.local.json",
  ".gitattributes",
  ".gitmodules",
]
SPDX-FileCopyrightText = "2025 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Vitest run-result cache written to node_modules/.vite/vitest/ during local
# test runs. Not committed (gitignored), but the REUSE tool scans the
# filesystem rather than the index, so a stale cache file trips the hook.
# Covered here rather than requiring `rm -rf` before every commit.
[[annotations]]
path = "node_modules/.vite/**"
SPDX-FileCopyrightText = "2025 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Typefaces bundled into the native Qt client (apps/rux/qt, Stream Q). Static
# TTFs from upstream: Archivo from github.com/Omnibus-Type/Archivo, Oswald from
# github.com/googlefonts/OswaldFont, JetBrains Mono from nixpkgs'
# jetbrains-mono 2.304 (github.com/JetBrains/JetBrainsMono). All SIL OFL-1.1.
[[annotations]]
path = "apps/rux/qt/resources/fonts/Archivo-*.ttf"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/rux/qt/resources/fonts/Oswald-*.ttf"
SPDX-FileCopyrightText = "2016 The Oswald Project Authors (https://github.com/googlefonts/OswaldFont)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/rux/qt/resources/fonts/JetBrainsMono-*.ttf"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Issue tracking (beads): config, hooks and agent integration files written by
# `bd init` / `bd setup`. The issues themselves live in refs/dolt/data.
[[annotations]]
path = [
  ".beads/**",
  ".agents/skills/beads/**",
  ".claude/settings.json",
  ".codex/**",
  ".cursor/**",
]
SPDX-FileCopyrightText = "2026 Povl Filip Sonne-Frederiksen"
SPDX-License-Identifier = "GPL-3.0-or-later"
