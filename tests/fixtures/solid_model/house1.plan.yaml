#
# house1 reference plan -- DRAFT, maintainer review pending (reusex-yf4.3).
#
# Hand-authored ground-truth target for the solid-model benchmark
# (docs/design/solid-model-json.md, docs/guides/solid-model-reference-authoring.md).
# Never round-trip this file through a writer (rux edit plan --export drops the
# comments): edit it by hand with the --watch loop.
#
# Source scan: scan archive 2024-06-13_house-1_afb3234950/reusex/project.rux
# (238 frames), clouds/planes regenerated with sensor-oriented normals, then
# `rux create storeys` (one storey). Nothing derived from the scan except this
# file is committed; point $REUSEX_HOUSE1_RUX at such a copy to use it.
#
# What the scan shows: an empty, stripped single-family house, one storey with a
# SPLIT LEVEL. The north block (entrance, WC, utility, kitchen, hall, two bedrooms)
# has its floor 0.75 m above the south block (living room, room S2, bathroom) and
# the east wing (bedroom, back entry); a short stair at x ~ -7.3 leads down from
# the hall into the living room, and the hall overlooks the living room over a
# parapet. The south block and the wing have a mono-pitch ceiling (~2.38 at the
# south facade to ~3.0 at the split wall). (reusex-2kd quoted ~0.85 m for the
# step; the floor-plane modes here give 0.75 m: north 0.73-0.75, south 0.00-0.02.)
#
# How the split level is represented: ONE storey (z_floor 0 = the lower, south
# floor). North-block spaces have z_floor 0.75 and its walls z_base 0.75; the two
# split walls (i-split-w/-e) run 0 -> 3.09. The format cannot represent the sloped
# ceiling (one z_ceiling per space, one height per wall) or the stair itself
# (see the follow-up bead in the report / reusex-yf4.3 notes).
#
# Method: wall faces fitted per 0.4 m bin from the cloud (sensor-oriented normals
# tell which side a face was seen from), axis = mean of the two faces, thickness =
# their separation where both sides agree; -1 (unknown) for external walls (only
# the inner face scanned; axis on the inner face) and where pose drift makes the
# two faces disagree by > 10 cm. Openings from depth-coloured elevations of the
# wall band. Rooms named from the sensor images (frame ids in each space's
# metadata); the house is empty, so names rest on fixtures left behind.
# Pose drift between rooms is 5-40 cm in places (see i-split-w); the plan follows
# the scan as registered, it does not correct the drift.
