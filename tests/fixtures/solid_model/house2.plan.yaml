#
# house2 reference plan -- DRAFT, maintainer review pending (reusex-yf4.3,
# re-fitted for reusex-ghy).
#
# Hand-authored ground-truth target for the solid-model benchmark
# (docs/design/solid-model-json.md, docs/guides/solid-model-reference-authoring.md).
# Never round-trip this file through a writer (rux edit plan --export drops the
# comments): edit it by hand with the --watch loop.
#
# Source: the house2 POSE REFERENCE, DRAFT v3
# (tests/fixtures/pose_reference/house2.{edits.yaml,trajectory.tum}, PR #84),
# not the stored poses. Rebuild the cloud the plan is drawn on like this (on a
# COPY of scan archive house-2_c582d1f758/reusex/project.rux, sha256
# 118645e0bbe2...e461 at schema v32):
#   rux -p copy.rux optimize --edits tests/fixtures/pose_reference/house2.edits.yaml \
#       --manhattan --odometry-robust --prior-sigma-trans 1 --prior-sigma-rot 1
#   rux -p copy.rux analyze poses --reference tests/fixtures/pose_reference/house2.trajectory.tum
#       # ATE 0 m / 0 m / 0 m, 384 poses
#   rux -p copy.rux create clouds && rux -p copy.rux create planes && rux -p copy.rux create storeys
# (all defaults, main 9e3c2eab, 2026-10-17). Scores against the cloud of the
# stored poses drop with this plan: that cloud is turned ~4 deg (storey 0) and
# ~7-15 deg (storey 1) against this one, and translated ~1.3 / 4.2 m in the
# level frame. That is expected; build $REUSEX_HOUSE2_RUX as above
# (scripts/bench-solid.manifest). Nothing derived from the scan except this
# file is committed.
#
# Frame: both storeys share ONE detected level frame (rux create storeys on the
# corrected copy; storey 1's own frame of the old plan, 0.5 deg off storey 0's,
# was drift): z = 0 on the ground-floor slab, storey 1's floor at z 2.89. The
# reference poses were solved with the Manhattan prior, so the level frame's x/y
# axes ARE the building grid: every wall below runs exactly along x or y.
#
# How it was re-fitted (2026-10-17): every element of the old plan was found
# again in the corrected cloud (back-projected depth, stride 4, 6.2 M points,
# placed with house2.trajectory.tum and taken into the level frame) and kept
# under its guid, name and role; only the geometry moved. Faces are the modes of
# 1 cm histograms across each wall, per 0.5-1 m piece along it, in the band
# 1.6-2.4 m (storey 0; above the furniture) or 0.3-1.9 m / 0.05-0.6 m
# (storey 1 full / knee walls); openings from elevations of the wall band
# (frame, sill, head); floors/ceilings per space are the z modes inside the
# polygon. Checked with plan cuts and sections per storey, old vs new plan
# overlaid (PR images).
#
# What the corrected cloud changed (the old plan's drift):
#  - storey 1 is no longer turned: its walls ran 7-15 deg off storey 0's in the
#    old plan; now both storeys sit on one grid. Every storey-1 element was
#    redrawn on it;
#  - storey 0 is no longer ghosted: the "rotated copies" of the old plan were
#    pose error. The kitchen's west wall (i0-kit-w) is where the old plan saw
#    "ghost copies further west" (x -6.92 here), not where it drew the axis; the
#    utility room's north wall (x0-util-n) has the kitchen behind it, so it is
#    internal; walls the old plan could not measure now show both faces
#    (i0-bath-w 0.16, i0-hall-s 0.18, i0-liv-w 0.15, i0-stair-n 0.17,
#    x0-s-liv 0.41, i0-ne-w 0.30, i1-gab-n-e 0.27);
#  - storey 1's west knee wall has no jog (x1-w-nw / x1-w-sw are collinear), and
#    the door into bedroom E is in its SOUTH wall (o1-corr-e-2 moved from
#    i1-long-e to i1-e-s, same door: the only way into the room);
#  - o1-corr-w-2 (corridor -> bedroom W, north end) is gone: no gap in i1-long-w
#    there; the bedroom-W corner meets the void between i1-nw-n and i1-n-s.
#  - New openings, now readable: o0-w-win and o0-util-door (west facade),
#    o0-ne-door (living room N -> room NE, a cased opening 1.22 m wide).
#
# Residual pose error the plan does NOT follow (Manhattan axes are on the mean
# face; the cloud deviates by up to the amount given): the ground-floor west
# block (frames 1-62: utility, hall) still runs ~2 deg off the grid, so
# x0-s-w, x0-util-n / i0-hall-n and the hall face of i0-hall-s lean +-8 cm
# along their length; bedroom W (frames 296-316) runs ~1.6 deg off, so i1-long-w
# and the west knee walls lean +-12 cm. The pose reference itself leaves these
# (its header: storey-1 walls within 2 deg on 74% of the area, reusex-wg8).
#
# UNRESOLVED: the gable room's floor is at z 3.11, 0.22 m above the rest of
# storey 1 (2.84-2.93), on the corrected poses too -- so it is probably a real
# step, not the drift the old plan blamed (reusex-32o); its walls start at the
# storey floor regardless. Living room N's outline (only a loop looking inwards
# was scanned; ceiling extent) and the conservatory's east side (glass, not
# scanned) are still assumptions. The first-floor bathroom's outline and the
# area between it and the gable room (x -1.5..-0.1, y 0.6..1.55) are unclear.
#
# Rooms named from the sensor images (frame ids in each space's metadata).
