#
# house2 reference plan -- DRAFT, maintainer review pending (reusex-yf4.3).
#
# Hand-authored ground-truth target for the solid-model benchmark
# (docs/design/solid-model-json.md, docs/guides/solid-model-reference-authoring.md).
# Never round-trip this file through a writer (rux edit plan --export drops the
# comments): edit it by hand with the --watch loop.
#
# Source scan: scan archive house-2_c582d1f758/reusex/project.rux (384 frames),
# clouds/planes regenerated with sensor-oriented normals, then `rux create
# storeys` (two storeys, each in its own level frame). Nothing derived from the
# scan except this file is committed; point $REUSEX_HOUSE2_RUX at such a copy.
#
# What the scan shows: a 1.5-storey house with a N-S ridge (gables north and
# south), a lower extension to the north-east (room NE) and a glazed conservatory
# to the south. The two storeys are tilted ~0.5 deg against each other (per-storey
# level frames below), and BOTH storeys carry heavy in-storey drift:
#  - storey 0 is ghosted: many walls appear twice, rotated up to ~15 deg; the north
#    half (living room N) was scanned walking a loop looking inwards, so its outer
#    walls are mostly missing;
#  - storey 1's walls run ~15 deg off storey 0's in the north and ~8 deg in the
#    south, and its gable room floor sits 0.14 m above the rest (reusex-32o).
# The plan follows the scan AS REGISTERED (the benchmark compares in this frame);
# it does not correct drift. Where a wall's two faces disagree it gets thickness
# -1 and an axis on the better face, and each such choice is noted. Where the scan
# cannot tell (living room N's outline, most storey-0 openings) the plan says so
# or leaves the element out, with a low confidence on what is drawn.
#
# Rooms named from the sensor images (frame ids in each space's metadata).
