#
# NewOffice reference plan (benchmark target, not ground truth -- decision D5).
# Hand-authored YAML: edit this file by hand, never round-trip it through a
# writer (`rux edit plan --export` drops every comment). Single source; the
# old newoffice.plan.json is gone. Format: docs/design/solid-model-json.md.
#
# HOW TO REVIEW (maintainer)
#   1. Work on a copy of the scan (opening a .rux can migrate it):
#        cp ~/repos/NewOffice/project.rux /tmp/no-review.rux
#   2. Open the plan over the cloud; it reloads on every save of this file:
#        rux -p /tmp/no-review.rux view \
#            --plan tests/fixtures/solid_model/newoffice.plan.yaml --watch
#      Keys: ] / [ move the cut 10 cm (} / { 1 m), v toggles the cut,
#      0 toggles the plan, 1-9 the layers. Look at cuts near 1.2 m, 2.0 m
#      and 2.6 m: below ~1.8 m shelving, vanities and boxes stand in front
#      of several walls.
#   3. Headless, with the wall-support check printed on every save:
#        rux -p /tmp/no-review.rux render \
#            --plan tests/fixtures/solid_model/newoffice.plan.yaml \
#            --watch --qa -o /tmp/no-review/qa.png
#   4. Every wall/opening whose geometry is assumed or uncertain says so in
#      a comment next to it ("PROVENANCE" / "DECISION" / "UNRESOLVED").
#      grep UNRESOLVED for the questions only someone who knows the
#      building can answer. When you accept the plan, remove the DRAFT
#      marks (`name`, `description`, the storey's `status`) and update the
#      fixture test SolidModelFixture_NewOffice_IsAValidDraftReference.
#
# Measurement conventions used throughout
#   - x/y are the project's world coordinates; the level frame only shifts z
#     (floor plane world z = -1.27 -> z = 0).
#   - "offset" = signed distance from a wall's axis, + = left of the axis
#     seen from its first point (the same sign `rux render --watch` prints).
#   - Faces were read as the mode / a robust line fit of the cloud points
#     whose normal is perpendicular to the wall, in height bands 0.3-0.9,
#     0.9-1.6, 1.6-2.2, 2.2-2.65 and 2.65-2.85 m (clutter stops ~1.8 m; the
#     higher bands decide), cross-checked against the sensor images.
#   - External walls: only the inner face is scanned, so the axis lies on
#     the inner (pier) face and thickness is -1 (unknown). Window niches sit
#     behind that face; their glass/frames are not the wall.
#   - The cloud is a 5 cm voxel SLAM fusion: a face is good to ~1-2 cm rms,
#     and a few walls show a doubled sheet (two scan passes ~0.1 m apart);
#     those are called out where they occur.
model_version: 1
units: m
name: "NewOffice reference (DRAFT)"
description: >-
  DRAFT - needs maintainer review. Authored by an agent from the NewOffice
  scan (project.rux cloud, 5 cm voxels) with the loop in
  docs/guides/solid-model-reference-authoring.md: faces measured from plan
  cuts of the cloud, checked with rux render --plan overlays. Not ground truth
  (decision D5). The room layout follows the maintainer's description
  (2026-10-15, bead reusex-z1v.2.6): one large open office with two meeting
  rooms at its end; on the other side a closed office, next to it a bathroom
  with 3 stalls, a printer and server room, a large kitchen / assembly space
  and a meeting room / storage at the end; rooms identified in plan cuts and
  sensor-frame images. x/y are the project's world coordinates; the level
  frame only shifts z so the floor plane (world z = -1.27) is z = 0. External
  walls carry the inner face as their axis with unknown thickness (the
  exterior was not scanned). Window sills/heads are read off elevations of the
  cloud and are approximate; door heads are assumed 2.05 m. 2026-10-15: walls
  flagged by the rux render --watch wall-support check re-measured (reusex-227;
  decisions in the YAML comments). 2026-10-16 (reusex-mdu): per the maintainer
  ("The stalls are fully enclosed rooms, so if our algorithm detects them as
  such that is alright"), the former single "Bathroom" space was split into
  the 3 WC stall spaces (s-wc-1/2/3) plus the shared washbasin/lobby space
  (s-bathroom-lobby), using the existing stall partition walls (p-wc-1-2,
  p-wc-2-3, p-wc-south, p-wc-east, p-office-south, p-corridor-east,
  p-bath-printer, x-east) as boundaries; see the comments at each new space.
  Same session: the "Printer/server room" space was likewise split into
  s-printer-room (front, from the corridor) and s-server-room (behind it,
  entered only through the printer room), separated by the new
  p-printer-server wall placed from a series of depth-sections through the
  room (see its comment).

