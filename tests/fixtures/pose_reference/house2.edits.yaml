#
# house2 pose reference: the edits -- DRAFT v3, maintainer review pending (reusex-rcv.1.8).
#
# The provenance half of the house2 pose reference (docs/guides/pose-reference-authoring.md);
# house2.trajectory.tum next to it is the frozen result. Written with the drift-correction
# loop (rux optimize --edits --watch, rux analyze drift) plus hand fits checked against plan
# cuts, sections and the colour images. Not ground truth: an agent's best reading of the scan.
# v2 (after the PR #84 review): the house must also fit a Manhattan grid -- every wall at 90
# deg to the others, open doors excepted -- so the reference is now solved with the
# Manhattan prior and four blocks are turned onto its grid.
# v3 (review of v2's long section): the stair descent (370-379) drew the stair-hall north wall
# (i0-stair-n) on top of its kitchen face -- a wall with no thickness. m-370-379 shifts it 0.19 m
# south; the wall measures 162-175 mm (stair side vs kitchen side; interior walls in the walls
# table 0.14-0.20 m, the plan's bathroom wall 0.18 m), was -30 mm (faces crossed) in v2.
#
# Source scan: scan archive house-2_c582d1f758/reusex/project.rux (384 frames, two storeys),
# the copy the solid-model plan house2.plan.yaml was drawn on (clouds/planes regenerated,
# `rux create storeys`; sha256 118645e0bbe2...e461 at schema v32). Nothing derived from the
# scan except these two files is committed; point $REUSEX_HOUSE2_RUX at such a copy.
#
# Starting poses (reusex-m53): sensor_frames.transform as the RTABMap import wrote it
# (c582d1f758-reimported.db, pipeline_log 2026-06-01); the log has no optimize, register or
# pose-edit entry. initial_transform is NULL on all 384 frames, so every solve seeds from
# transform. Moves are deltas on these poses.
#
# Replay (on a COPY; deterministic, reproduces house2.trajectory.tum to the last digit):
#   rux -p copy.rux optimize --edits house2.edits.yaml --manhattan \
#       --odometry-robust --prior-sigma-trans 1 --prior-sigma-rot 1
#   rux -p copy.rux export trajectory -o house2.trajectory.tum
# The four solver flags are part of the reference:
#  - --manhattan (reusex-rqn.1): ties the wall landmarks to one grid. Alone it takes the
#    storey-1 vs storey-0 heading from -4.4 to -0.1 deg and segment headings from median 3.9
#    / max 8.4 deg to 1.1 / 3.9, at pass-to-pass 12.6 mm (plain optimize 13.8). It cannot
#    straighten a block whose frames see a room only from inside (plane factors are loose,
#    sigma_normal 14 deg), so the four heading moves below finish the job. Tried with the v1
#    edits as they were: no effect, because the v1 guards pinned every segment at plain
#    optimize's (rotated) poses; the guards are now taken from the Manhattan solve.
#  - --odometry-robust: the tail (384-389) was captured walking fast down the stair and the
#    hall (motion blur), and its odometry links are wrong by 10-13 deg. With odometry as
#    known inliers a move there either drags the whole graph (up to 1.7 m) or is fought off
#    (41-62% realised); robust odometry lets GNC drop the broken links (reusex-39h).
#  - --prior-sigma-trans 1 --prior-sigma-rot 1: move m-1-33 holds node 1, the gauge; the
#    default 1 mm / 0.06 deg gauge prior would fight it. The guards fix the gauge instead.
# The g-* anchors are guards: all-DoF anchors at the Manhattan solve's poses (no edits,
# --manhattan --odometry-robust) on 3 nodes of every segment no move names, so each move is measured against
# the rest as that solve has it and cannot drag the trajectory. All edits read honoured in
# --watch; plain optimize --edits reads m-246-293 NOT HONOURED by the older block-RMS rule
# (bent 22 mm across 48 frames, realised 99% / 99%; reusex-wwr).
#
# Frame: world. Coordinates in the notes are in storey 0's level frame (the frame of the plan
# cuts and of house2.plan.yaml): level = world + (-5.92, -4.63, +1.59) m, rotated < 0.2 deg.
# The Manhattan solve turns the whole house ~5 deg about node 1 against plain optimize, so
# house2.plan.yaml (drawn on the stored poses) no longer overlays it; see reusex-ghy.
#
# Result (rux analyze drift, defaults, --plan house2.plan.yaml; 12 segments for the pairs):
#                                 stored       plain optimize  DRAFT v1      DRAFT v2      this (v3)
#   noise floor                   7.2 mm       7.3 mm          7.2 mm        7.3 mm        7.3 mm
#   pass-to-pass median (p90)     15.9 (56.1)  13.8 (43.8)     11.0 (36.2)   10.4 (34.5)   10.3 (34.8) mm = 1.4x floor
#   segment-pair median           53.1 mm      28.4 mm         23.7 mm       25.6 mm       25.0 mm
#   worst segment pair            130.3 mm     105.2 mm        116.0 mm      90.8 mm       90.8 mm (*)
#   doubled-wall patches s0 / s1  0.27 / 0.22  0.26 / 0.22     0.27 / 0.22   0.28 / 0.21   0.27 / 0.20
#   through-wall steps, plan      8 of 13      7 of 12         6 of 11       11 of 20      11 of 20 (**)
#   through-wall steps, own walls 3            4               3             1             1 (**)
#   stair-hall north wall, faces  -            -               -             -30 mm        162-175 mm
# Manhattan fit (acceptance added in the review; target: every full-height wall within
# +-1 deg of its storey grid, storey grids within 0.5 deg of each other, every segment's
# heading within 1 deg). Grid = the Manhattan prior's estimator (weighted 4*phi circular mean,
# re-centred 3x over the walls within 15 deg) on the scan's own wall points:
#                                 plain optimize   DRAFT v1         DRAFT v2         this (v3)
#   storey-1 grid vs storey-0     -4.39 deg        -5.54 deg        -0.03 deg        -0.05 deg (met)
#   segment heading |median|/max  3.87 / 8.38 deg  2.80 / 9.35 deg  0.25 / 1.19 deg  0.26 / 1.19 (seg 3)
#   wall planes (rux planes, role wall; |dev| median, area within 1 / 2 deg):
#     storey 0                    2.10, 41 / 51%   2.15, 28 / 58%   0.65, 50 / 92%   0.77, 52 / 90%
#     storey 1                    2.28, 23 / 49%   2.26, 23 / 49%   1.47, 43 / 77%   1.36, 50 / 74%
#   wall patches (0.5 m, points-weighted |dev| median / p90, within 1 deg):
#     storey 0                    2.18 / 9.4, 25%  1.82 / 8.6, 36%  0.91 / 6.6, 55%  0.89 / 6.4, 56%
#     storey 1                    3.48 / 7.7, 16%  3.44 / 7.8, 16%  1.62 / 5.1, 24%  1.61 / 8.4, 23%
#   (v3's storey-1 patch p90 rises with two stairwell patches the shifted descent now draws
#   apart from the rest: the stair's south edge at (0.8, -3.7), 39 deg, and the north wall's
#   upper part, 8-9 deg.) The per-wall target is NOT met: storey 0 is within 2 deg on 90% of
#   wall area, storey 1 on 74%. Door leaves excluded: a plane shorter than 1.2 m along the wall whose top stays more
#   than 0.25 m below the ceiling (13 planes); a patch run shorter than 1.2 m whose top stays
#   below floor + 2.3 m. Off-grid planes left: storey 1 plane at 34.6 deg in bedroom N = the
#   free-standing wardrobe set at an angle (image 356), not a wall; storey 0 plane at 10.2 deg
#   at the hall/bathroom door (merges the open door leaf with the wall).
# (*) v2 / v3: seg 8 into seg 10 and seg 3 into seg 7, 900 / 7000 points: the landing seen from the
#     bedroom-E door, and living room S's east wall seen twice (m-230-245 turned seg 7 there).
# (**) Against house2.plan.yaml the count rose to 11 of 20 because the plan was drawn on the
#     stored poses, whose storey 1 north is turned ~8 deg; the straightened camera paths no
#     longer fit its walls (plan re-fit: reusex-ghy). Plan-free check instead: steps of <= 1.5 m
#     whose straight line passes within 3 cm of the scan's own wall points (1.0-1.8 m above
#     the floor, same poses). One left: 331 -> 332 in bedroom E, images 331-333 show the
#     camera walking past the open door leaf -- explained.
#
# Unresolved (DRAFT):
#  - the per-wall Manhattan target (above): storey 1's remaining spread is within rooms seen
#    in one pass (bedroom N's north wall -3 deg, the bedroom-E/corridor wall +4 deg). A whole-
#    segment heading move cannot reach it; a 'this block is Manhattan' edit could (reusex-wg8).
#  - seg 3 (102-133) heading 1.2 deg: its segment-ICP suggestion made pass-to-pass and the
#    segment-pair median worse in the Manhattan solve (11.2 mm, 29.3 mm) and was dropped.
#  - the doubled-wall share does not move: most two-layered patches are the stair treads and
#    furniture, common to every solve (see the guide's worked example).
