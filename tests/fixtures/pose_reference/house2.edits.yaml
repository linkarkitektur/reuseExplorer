#
# house2 pose reference: the edits -- DRAFT, maintainer review pending (reusex-rcv.1.8).
#
# The provenance half of the house2 pose reference (docs/guides/pose-reference-authoring.md);
# house2.trajectory.tum next to it is the frozen result. Written with the drift-correction
# loop (rux optimize --edits --watch, rux analyze drift) plus hand fits checked against plan
# cuts, sections and the colour images. Not ground truth: an agent's best reading of the scan.
#
# Source scan: scan archive house-2_c582d1f758/reusex/project.rux (384 frames, two storeys),
# the copy the solid-model plan house2.plan.yaml was drawn on (clouds/planes regenerated,
# `rux create storeys`; sha256 118645e0bbe2...e461 at schema v32). Nothing derived from the
# scan except these two files is committed; point $REUSEX_HOUSE2_RUX at such a copy.
#
# Starting poses (reusex-m53): sensor_frames.transform as the RTABMap import wrote it
# (c582d1f758-reimported.db, pipeline_log 2026-06-01); the log has no optimize, register or
# pose-edit entry. initial_transform is NULL on all 384 frames, so every solve seeds from
# transform. Moves are deltas on these poses.
#
# Replay (on a COPY; deterministic, reproduces house2.trajectory.tum to the last digit):
#   rux -p copy.rux optimize --edits house2.edits.yaml \
#       --odometry-robust --prior-sigma-trans 1 --prior-sigma-rot 1
#   rux -p copy.rux export trajectory -o house2.trajectory.tum
# The three solver flags are part of the reference:
#  - --odometry-robust: the tail (384-389) was captured walking fast down the stair and the
#    hall (motion blur), and its odometry links are wrong by 10-13 deg. With odometry as
#    known inliers a move there either drags the whole graph (up to 1.7 m) or is fought off
#    (41-62% realised); robust odometry lets GNC drop the broken links. Plain optimize
#    with all three flags is unchanged (cross-segment 28.4 mm, pass-to-pass 13.8 mm).
#  - --prior-sigma-trans 1 --prior-sigma-rot 1: move m-1-33 holds node 1, the gauge; the
#    default 1 mm / 0.06 deg gauge prior would fight it. The guards fix the gauge instead.
# The g-* anchors are guards: one all-DoF anchor at its plain-optimize pose on 3 nodes of
# every segment no move names, so each move is measured against the rest as plain optimize
# has it and cannot drag the trajectory (without them the first tail move rotated the whole
# graph about the gauge).
#
# Frame: world. Coordinates quoted in the notes are in storey 0's level frame (the frame of
# the plan cuts and of house2.plan.yaml): level = world + (-5.92, -4.63, +1.59) m, rotated
# less than 0.2 deg.
#
# Result (rux analyze drift, defaults, --plan house2.plan.yaml; 12 segments for the pairs):
#                                 stored poses     plain optimize   this reference
#   noise floor                   7.2 mm           7.3 mm           7.2 mm
#   pass-to-pass median (p90)     15.9 (56.1) mm   13.8 (43.8) mm   11.0 (36.2) mm = 1.5x floor
#   frames above the flag         63 of 248        26 of 250        14 of 258
#   segment-pair median           53.1 mm          28.4 mm          23.7 mm
#   worst segment pair            130.3 mm         105.2 mm         116.0 mm (*)
#   through-wall crossings        8 of 13          7 of 12          6 of 11, all at doorways (**)
#   doubled-wall patches, s0      197/724 (0.27)   193/737 (0.26)   190/703 (0.27)
#   doubled-wall patches, s1      87/394 (0.22)    89/401 (0.22)    89/400 (0.22)
# (*) seg 0 into seg 2: the two faces of the 0.18 m bathroom wall i0-bath-w, seen from the
#     south-west room by seg 0 and from the bathroom by seg 2, fall inside the 0.3 m pair
#     gate; in plain optimize they were 0.5 m apart, outside it. Next: seg 1 into seg 3
#     81.9 mm, seg 11 into seg 8 72.6 mm (corridor / landing on storey 1).
# (**) 196->197 i0-n-s (images 195-197 pass a door frame into the passage); 294->295 and
#     317->318 i1-long-w at s 1.26 / 1.23 m (images 293 and 319: doorways into bedroom W;
#     the plan's o1-corr-w-1 sits at s 0.1-0.7, conf 0.6); 320->321 i1-e-s at s 0.36 m
#     (image 319: the door into bedroom E at the corridor corner); 335->336 i1-e-ne at
#     s 0.54 m (image 334: the door into bedroom NE); 384->385 i0-stair-s at s 1.89 m, the
#     stair-hall opening into living room S (images 383-385; plain optimize and the stored
#     poses cross it too). Gone: 4->5 x0-w (seg 0's tilt), 388->389 i0-hall-n (the tail).
#
# Unresolved (DRAFT):
#  - the storeys' headings: in plan-axis terms (house2.plan.yaml, drawn on the stored poses;
#    plain optimize and this reference turn storey 1 by only 1.1-1.6 deg against them, and
#    storey 0 by -1.6 .. +1.6 deg per segment) storey 1 sits ~4 deg off storey 0 over the
#    gable room and ~8 deg off it in the north; within storey 1 the gable room and the
#    bedrooms differ by ~6.5 deg, within storey 0 the south and the north halves by ~3.5 deg.
#    Only the stair links the storeys and the north rooms were scanned in single passes, so no
#    pass-to-pass number sees this and no edit here touches it: it needs a stacked-facade or
#    plan constraint (follow-up bead).
#  - seg 7 (230-261) in living room S is ~6 deg off segs 2-4; a hand move (238-243) made
#    pass-to-pass and both doubled shares worse and was dropped, as were the seg 1 and seg 11
#    suggestions (pass-to-pass worse). Seg 8's was a wash (storey-1 doubled share 0.22 ->
#    0.19 in one solve, gone with denser guards).
#  - the doubled-wall share is not reduced: most two-layered patches are the stair treads
#    and furniture, common to every solve (see the guide's worked example).
