#
# Build-and-test CI, running on every push to main and every pull request
# (#202). The nix dependency closure (PCL, OpenCV, RTABMap, OpenMVS, libtorch,
# GTSAM, HiGHS, OpenNURBS — several rebuilt by our overlays) is far too large
# to build from scratch on a GitHub-hosted runner, so the paths that
# cache.nixos.org cannot serve are pulled from our own Cachix cache:
#
#   https://reusex.cachix.org   (public: reads need no token)
#
# See docs/guides/ci-cache.md for what lives in that cache, how big it is, and
# how to re-seed it from a dev machine.
#
# Cheap, cache-free gates (clang-format, REUSE/SPDX) live in
# .github/workflows/lint.yml (#250) and deliberately do not touch nix at all.
# ruxd's and the web frontend's own CI gates moved with them to their own
# repos (repo split, P4, 2026-10-09).
#
# The local equivalents of this workflow are:
#   scripts/check.sh                          (fast incremental build + ctest)
#   nix build .#checks.x86_64-linux.tests     (hermetic build + ctest)
#   scripts/ci-local.sh                       (the same, then push the pass
#                                              stamp to Cachix for this job)
#
# CI is meant to *confirm*, not to build (reusex-37v). checks.tests' output
# is a small pass stamp (flake.nix). Run scripts/ci-local.sh on the commit
# you push and it lands in reusex.cachix.org; this job then evaluates the
# same derivation, substitutes the stamp and compiles nothing. Only when no
# one pushed a stamp for this exact derivation does it fall back to the full
# hermetic build (~25-45 min on a 4-vCPU runner).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the run it
# supersedes: a full C++ build is the most expensive thing in this repo's CI
# budget. main is exempt so every merged commit is actually built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: the build-and-test job also files warning issues
# on main-branch pushes, so it needs issues:write.  PRs and fork runs never
# reach the issue-filing step (guarded by the `if:` below) and the permission
# is harmless when unused.
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Build + ctest (CPU variant)
    runs-on: ubuntu-latest
    # CACHIX_AUTH_TOKEN is an *environment* secret scoped to the `CI`
    # environment, not a repo-level secret, so the job has to opt in here or
    # `secrets.CACHIX_AUTH_TOKEN` silently evaluates to the empty string.
    # The environment carries no protection rules and no branch policy, so
    # this neither gates nor delays the run.
    environment: CI
    # A substituted run takes a couple of minutes. A full build, warm
    # (dependency closure already in Cachix), is dominated by the ReUseX
    # compile itself on a 4-vCPU runner. The ceiling is generous so a cold
    # run — one where an overlay bump invalidated a big dependency — can
    # still finish and repopulate the cache rather than being killed halfway.
    timeout-minutes: 120
    steps:
      # No disk-cleanup step here on purpose. Measured on a green run with no
      # cleanup at all: / is 145 GB and still had 80 GB free at the end of the
      # job, with /nix/store at 7.0 GB. The widely-copied "free up runner disk
      # space" incantation cost 38 s to reclaim space nothing needed. If a
      # future dependency bump changes that, the "Report disk usage" step below
      # is what will show it.
      - uses: actions/checkout@v4
        with:
          # On a pull request, test the branch head, not GitHub's synthetic
          # refs/pull/N/merge commit: the head is what scripts/ci-local.sh
          # built locally, so only its derivation can be a cache hit. The
          # source is lib.fileset-narrowed (default.nix), so the merge commit
          # gives the same derivation anyway whenever main has not touched a
          # build-relevant file since the branch point; when it has, the merge
          # is tested on main after merging (push event below).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # tests/fixtures/** binaries (.pcd/.db/.e57/.rux) are LFS-tracked and
          # ctest reads them, so pointer files would fail the suite.
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: reusex
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Read from the cache everywhere; write only from main. PRs get
          # their pass stamp into the cache from scripts/ci-local.sh, not
          # from here; fork PRs get no secrets, so pushing could never work
          # there anyway. Reads are unaffected: the cache is public.
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # Prints the derivation and output path first, so a local
      # `nix path-info --derivation .#checks.x86_64-linux.tests` on the same
      # commit can be compared against this log.
      #
      # Then tries a substitute-only realisation (`--max-jobs 0`: nix may
      # download, never build). That succeeds when scripts/ci-local.sh pushed
      # this derivation's pass stamp, and the job is done in seconds. On a
      # miss it falls back to the full build: CPU variant (WITH_CUDA=OFF, the
      # runners have no GPU), BUILD_TESTS=ON, ctest and the package install
      # check inside the sandbox.
      #
      # `shell: bash` matters: GitHub's *default* shell is `bash -e {0}`,
      # without pipefail, and with it `nix build ... | tee` exited 0 whatever
      # nix did. That is how bench_solid_compare_selftest failed on every run
      # (main included) while the job stayed green, until reusex-37v.
      #
      # The full build's output is teed to build-warnings.log so the
      # warning-sync step below can parse compiler diagnostics without a
      # second compile.
      - name: Build and run tests (substitute if ci-local.sh pushed it)
        id: tests
        shell: bash
        run: |
          attr='.#checks.x86_64-linux.tests'
          drv=$(nix path-info --derivation "$attr")
          out=$(nix eval --raw "$attr.outPath")
          echo "commit:     $(git rev-parse HEAD)"
          echo "derivation: $drv"
          echo "output:     $out"
          if nix build "$attr" --max-jobs 0 --no-link --print-build-logs; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=checks.tests substituted::$out came from reusex.cachix.org (pushed by scripts/ci-local.sh); nothing was compiled or re-run here."
            cat "$out/passed"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=checks.tests built::No pass stamp for $drv in the cache; running the full build + ctest. Run scripts/ci-local.sh before pushing to skip this."
            nix build "$attr" --no-link --print-build-logs 2>&1 | tee build-warnings.log
          fi

      # The installable CPU package (headers + libs + CMake config) is what
      # downstream repos (ReUse-X/ruxd) build against. Build it exactly the
      # way they fetch it - as a github: flake ref of this commit, not from
      # the checkout (`.#cpu` gives a different source, hence a different
      # store path) - so the cachix action pushes the path they will ask for.
      - name: Build CPU package for downstream consumers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix build "github:${{ github.repository }}/${{ github.sha }}#cpu" --print-build-logs

      # Parse GCC/Clang warning lines from the build log and sync them to
      # GitHub issues (create new, close fixed, skip existing).  Only runs on
      # main-branch pushes — PRs and fork runs do not write issues.
      # Skipped when the result was substituted: there is no build log then,
      # and an empty log would read as "every warning fixed" and close them.
      - name: Sync warning issues
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tests.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/file_build_warnings.py build-warnings.log

      # Cheap early warning: if the closure ever starts crowding the runner,
      # this is where it shows up first (7.0 GB store / 80 GB free as of the
      # last green run).
      - name: Report disk usage
        if: always()
        run: |
          du -sh /nix/store 2>/dev/null || true
          df -h /
