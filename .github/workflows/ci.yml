#
# Build-and-test CI, running on every push to main and every pull request
# (#202). The nix dependency closure (PCL, OpenCV, RTABMap, OpenMVS, libtorch,
# GTSAM, HiGHS, OpenNURBS — several rebuilt by our overlays) is far too large
# to build from scratch on a GitHub-hosted runner, so the paths that
# cache.nixos.org cannot serve are pulled from our own Cachix cache:
#
#   https://reusex.cachix.org   (public: reads need no token)
#
# See docs/guides/ci-cache.md for what lives in that cache, how big it is, and
# how to re-seed it from a dev machine.
#
# Cheap, cache-free gates (clang-format, REUSE/SPDX) live in
# .github/workflows/lint.yml (#250) and deliberately do not touch nix at all.
# ruxd's and the web frontend's own CI gates moved with them to their own
# repos (repo split, P4, 2026-10-09).
#
# The local equivalents of this workflow are:
#   scripts/check.sh                (fast incremental build + ctest)
#   nix build .#ci --print-out-paths | cachix push reusex
#                                   (exactly what this job realises, then
#                                    pushed so this job can substitute it)
#
# CI is meant to *confirm*, not to build (reusex-37v, reusex-uk8). Build and
# test are separate derivations (flake.nix): `.#cpu` compiles ReUseX once
# (outputs `out`, the package, and `testsuite`, the test binaries) and
# `checks.tests` runs ctest + the install check against them and leaves a
# small pass stamp. `.#ci` is both. Build and push it locally on the commit
# you push, and this job evaluates the same derivations, substitutes them and
# compiles nothing. Only on a miss does it build, and then only what is
# missing: with `.#cpu` cached it just runs the tests (~5 min), without it
# the full compile (~25-45 min on a 4-vCPU runner).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the run it
# supersedes: a full C++ build is the most expensive thing in this repo's CI
# budget. main is exempt so every merged commit is actually built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: the build-and-test job also files warning issues
# on main-branch pushes, so it needs issues:write.  PRs and fork runs never
# reach the issue-filing step (guarded by the `if:` below) and the permission
# is harmless when unused.
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Build + ctest (CPU variant)
    runs-on: ubuntu-latest
    # CACHIX_AUTH_TOKEN is an *environment* secret scoped to the `CI`
    # environment, not a repo-level secret, so the job has to opt in here or
    # `secrets.CACHIX_AUTH_TOKEN` silently evaluates to the empty string.
    # The environment carries no protection rules and no branch policy, so
    # this neither gates nor delays the run.
    environment: CI
    # A substituted run takes a couple of minutes. A full build, warm
    # (dependency closure already in Cachix), is dominated by the ReUseX
    # compile itself on a 4-vCPU runner. The ceiling is generous so a cold
    # run — one where an overlay bump invalidated a big dependency — can
    # still finish and repopulate the cache rather than being killed halfway.
    timeout-minutes: 120
    steps:
      # No disk-cleanup step here on purpose. Measured on a green run with no
      # cleanup at all: / is 145 GB and still had 80 GB free at the end of the
      # job, with /nix/store at 7.0 GB. The widely-copied "free up runner disk
      # space" incantation cost 38 s to reclaim space nothing needed. If a
      # future dependency bump changes that, the "Report disk usage" step below
      # is what will show it.
      - uses: actions/checkout@v4
        with:
          # On a pull request, test the branch head, not GitHub's synthetic
          # refs/pull/N/merge commit: the head is what the developer built
          # (nix build .#ci) and pushed, so only its derivation can be a cache hit. The
          # source is lib.fileset-narrowed (default.nix), so the merge commit
          # gives the same derivation anyway whenever main has not touched a
          # build-relevant file since the branch point; when it has, the merge
          # is tested on main after merging (push event below).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # tests/fixtures/** binaries (.pcd/.db/.e57/.rux) are LFS-tracked and
          # ctest reads them, so pointer files would fail the suite.
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: reusex
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Read from the cache everywhere; write only from main. PRs get
          # their `.#ci` into the cache from the developer's push, not from
          # here; fork PRs get no secrets, so pushing could never work
          # there anyway. Reads are unaffected: the cache is public.
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # `.#ci` (flake.nix) is everything CI realises: the pass stamp
      # (checks.tests: ctest + package install check, no compile) and the
      # CPU package with its testsuite output (checks.cpu = packages.cpu).
      # The developer ran the same `nix build .#ci` and pushed it before
      # pushing the branch (docs/guides/ci-cache.md), so:
      #   1. print the derivations and nix's plan (`--dry-run`: what it
      #      would fetch, what it would build), so a local
      #      `nix path-info --derivation .#ci` on the same commit can be
      #      compared against this log;
      #   2. try a substitute-only realisation (`--max-jobs 0`: nix may
      #      download, never build). A hit means the job compiled and ran
      #      nothing;
      #   3. on a miss, build what is missing. If the plan contains the
      #      ReUseX build itself, that is the full compile (CPU variant,
      #      WITH_CUDA=OFF: the runners have no GPU, ~25-45 min); otherwise
      #      the package was cached and only the tests run.
      # Each branch ends with a ::notice saying which path it took.
      #
      # `shell: bash` matters: GitHub's *default* shell is `bash -e {0}`,
      # without pipefail, and with it `nix build ... | tee` exited 0 whatever
      # nix did. That is how bench_solid_compare_selftest failed on every run
      # (main included) while the job stayed green, until reusex-37v.
      - name: nix build .#ci (substitute first, build only on a miss)
        id: tests
        shell: bash
        run: |
          echo "commit:  $(git rev-parse HEAD)"
          echo "ci:      $(nix path-info --derivation .#ci)"
          echo "cpu:     $(nix path-info --derivation .#checks.x86_64-linux.cpu)"
          echo "tests:   $(nix path-info --derivation .#checks.x86_64-linux.tests)"
          plan=$(nix build .#ci --dry-run 2>&1 || true)
          echo "$plan"
          echo "compiled=false" >> "$GITHUB_OUTPUT"
          if nix build .#ci --max-jobs 0 --no-link --print-build-logs; then
            echo "::notice title=.#ci substituted::Everything came from reusex.cachix.org (pushed after a local nix build .#ci); nothing was compiled or tested here."
          else
            if grep -qE -- '-ReUseX-[0-9.]+\.drv' <<<"$plan"; then
              echo "compiled=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=.#ci built (full compile)::Neither the pass stamp nor the .#cpu package of this commit is in the cache: compiling, then testing. Push the local nix build .#ci before pushing the branch to skip this."
            else
              echo "::notice title=.#ci built (tests only)::The .#cpu package of this commit was cached but the pass stamp was not: running ctest + the install check, no compile."
            fi
            nix build .#ci --no-link --print-build-logs 2>&1 | tee build-warnings.log
          fi
          cat "$(nix path-info .#ci)/tests/passed"

      # Downstream repos (ReUse-X/ruxd) fetch the CPU package as a github:
      # flake ref of this commit. That must be the very path realised above
      # as part of `.#ci` (checks.cpu = packages.cpu), or they would find nothing in
      # the cache: the build source leaves out the LFS fixtures a GitHub
      # tarball carries as pointers (default.nix), so the two are the same
      # derivation. This step proves it on every main push; if they ever
      # differ it says so and builds the github: ref (the cachix action
      # then pushes it).
      - name: Check the CPU package for downstream consumers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ref="github:${{ github.repository }}/${{ github.sha }}#cpu"
          ref_drv=$(nix path-info --derivation "$ref")
          local_drv=$(nix path-info --derivation .#checks.x86_64-linux.cpu)
          echo "github: ref derivation: $ref_drv"
          echo "checkout derivation:    $local_drv"
          if [[ "$ref_drv" == "$local_drv" ]]; then
            nix build "$ref" --max-jobs 0 --no-link
            echo "::notice title=downstream .#cpu = checkout .#cpu::$ref is the derivation realised above; nothing to build."
          else
            echo "::warning title=downstream .#cpu differs::$ref evaluates to a different derivation than .#cpu from the checkout; building it. Fix the fileset in default.nix (reusex-uk8)."
            nix build "$ref" --no-link --print-build-logs
          fi

      # Parse GCC/Clang warning lines from the build log and sync them to
      # GitHub issues (create new, close fixed, skip existing).  Only runs on
      # main-branch pushes — PRs and fork runs do not write issues.
      # Skipped unless this job compiled `.#cpu`: a substituted package has no
      # compiler log, and an empty log would read as "every warning fixed"
      # and close them.
      - name: Sync warning issues
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tests.outputs.compiled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/file_build_warnings.py build-warnings.log

      # Cheap early warning: if the closure ever starts crowding the runner,
      # this is where it shows up first (7.0 GB store / 80 GB free as of the
      # last green run).
      - name: Report disk usage
        if: always()
        run: |
          du -sh /nix/store 2>/dev/null || true
          df -h /
